<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KML Canvas Viewer</title>
    <meta name="theme-color" content="#0f1115">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <div class="loading-text">Loading Assets...</div>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="dropZone" class="drop-zone hidden">
        <div class="drop-message">
            <span class="icon">📂</span>
            <h2>Drop KML or GPX files here</h2>
        </div>
    </div>

    <div class="ui-overlay">
        <div class="panel info-panel" id="infoPanel">
            <div class="panel-header">
                <h1>KML Viewer</h1>
                <button id="minimizeInfoBtn" class="minimize-btn" title="Toggle Panel">−</button>
            </div>
            <p class="subtitle">Canvas Renderer</p>
            <div id="stats" class="stats">
                <div class="stat-item">
                    <span class="label">Polygons</span>
                    <span id="polyCount" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Lines</span>
                    <span id="lineCount" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Points</span>
                    <span id="pointCount" class="value">0</span>
                </div>
                <div class="stat-item" style="grid-column: span 3; margin-top: 8px;">
                    <span class="label">Path Distance</span>
                    <span id="pathDistance" class="value" style="color: var(--accent);">-</span>
                </div>
                <div class="stat-item" style="grid-column: span 3;">
                    <span class="label">Szlaki</span>
                    <span id="trailDistance" class="value" style="color: #22c55e;">0.0 km</span>
                </div>
                <div class="stat-item" style="grid-column: span 3;">
                    <span class="label">Trasy użytkownika</span>
                    <span id="userRouteDistance" class="value" style="color: #38bdf8;">0.0 km</span>
                </div>
            </div>
            <div class="info-panel-section">
                <h3 style="font-size: 14px; margin: 0 0 4px 0; color: #9ca3af;">Tile Preview</h3>
                <select id="tileZoomSelect" class="panel-select">
                    <option value="">Brak</option>
                    <option value="11">Z11</option>
                    <option value="14">Z14</option>
                    <option value="17">Z17</option>
                    <option value="18">Z18</option>
                    <option value="19">Z19</option>
                    <option value="20">Z20</option>
                    <option value="21">Z21</option>
                    <option value="22">Z22</option>
                </select>
            </div>
        </div>

        <div id="layersPanel" class="panel layers-panel hidden">
            <div class="layers-panel-header">
                <h2>Layers</h2>
            </div>
            <label class="layer-item">
                <input type="checkbox" class="layer-checkbox" id="trackLocation">
                <span class="layer-label">📍 Track Location</span>
            </label>
            <div class="panel-divider"></div>

            <section class="menu-group" data-group="squadrats">
                <button type="button" class="menu-group-toggle" data-target="squadrats">
                    <span>Squadrats</span>
                    <span class="menu-group-icon">−</span>
                </button>
                <div class="menu-group-body" data-group-body="squadrats">
                    <label class="layer-item">
                        <input type="checkbox" class="layer-checkbox" id="layerSquadrats">
                        <span class="layer-label">Squadrats (Z14)</span>
                    </label>
                    <label class="layer-item">
                        <input type="checkbox" class="layer-checkbox" id="layerSquadrathinos">
                        <span class="layer-label">Squadrathinos (Z17)</span>
                    </label>
                    <label class="layer-item">
                        <input type="checkbox" class="layer-checkbox" id="layerTile17">
                        <span class="layer-label">Tile17 (DB)</span>
                    </label>
                    <label class="layer-item">
                        <input type="checkbox" class="layer-checkbox" id="layerUbersquadrat">
                        <span class="layer-label">Ubersquadrat (Z11)</span>
                    </label>
                    <label class="layer-item">
                        <input type="checkbox" class="layer-checkbox" id="layerUbersquadratinho">
                        <span class="layer-label">Ubersquadratinho (Z14)</span>
                    </label>
                </div>
            </section>

            <div class="panel-divider"></div>
            <section class="menu-group" data-group="gpx-trails">
                <button type="button" class="menu-group-toggle" data-target="gpx-trails">
                    <span>Szlaki GPX</span>
                    <span class="menu-group-icon">−</span>
                </button>
                <div class="menu-group-body" data-group-body="gpx-trails">
                    <label class="layer-item">
                        <input type="checkbox" class="layer-checkbox" id="trailsLayerEnabled">
                        <span class="layer-label">Pokaż szlaki</span>
                    </label>
                    <div class="trail-type-row">
                        <label class="layer-item compact">
                            <input type="checkbox" class="layer-checkbox" id="trailTypeFoot" checked>
                            <span class="layer-label">foot</span>
                        </label>
                        <label class="layer-item compact">
                            <input type="checkbox" class="layer-checkbox" id="trailTypeHiking" checked>
                            <span class="layer-label">hiking</span>
                        </label>
                    </div>
                    <select id="trailRegionSelect" class="panel-select" multiple size="5"></select>
                    <div id="trailLayerStatus" class="layer-status">Szlaki wyłączone</div>
                </div>
            </section>

            <div class="panel-divider"></div>
            <section class="menu-group" data-group="user-routes">
                <button type="button" class="menu-group-toggle" data-target="user-routes">
                    <span>Trasy użytkownika</span>
                    <span class="menu-group-icon">−</span>
                </button>
                <div class="menu-group-body" data-group-body="user-routes">
                    <label class="layer-item">
                        <input type="checkbox" class="layer-checkbox" id="userRoutesLayerEnabled">
                        <span class="layer-label">Pokaż trasy użytkownika</span>
                    </label>
                    <div id="userRouteLayerStatus" class="layer-status">Trasy użytkownika wyłączone</div>
                </div>
            </section>

            <div class="panel-divider"></div>
            <select id="mapSource" class="panel-select">
                <option value="standard">🗺️ Standard (OSM)</option>
                <option value="cycle">🚲 Cycle Map (OCM)</option>
                <option value="satellite">🛰️ Satellite (Esri)</option>
            </select>
        </div>

        <div id="mapAttribution" class="map-attribution">
            Tiles © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors
        </div>

        <div class="panel bottom-toolbar">
            <div class="controls-panel">
                <button id="layersBtn" class="icon-btn" title="Toggle Layers">☰</button>
                <div class="divider"></div>
                <button id="trackBtn" class="icon-btn" title="Track Location">📡</button>
                <div class="divider"></div>
                <button id="calcPathBtn" class="icon-btn" title="Calculate Path">📍</button>
                <div class="divider"></div>
                <button id="resetViewBtn" class="icon-btn" title="Reset View">⟲</button>
                <div class="divider"></div>
                <button id="zoomOutBtn" class="icon-btn" title="Zoom Out">−</button>
                <label class="zoom-slider-control" title="Zoom">
                    <div class="zoom-slider-main">
                        <input id="zoomSlider" type="range" min="1" max="22" step="0.25" value="8" list="zoomTicks">
                        <span id="zoomValue">8.0</span>
                    </div>
                    <datalist id="zoomTicks">
                        <option value="1" label="1"></option>
                        <option value="6" label="6"></option>
                        <option value="11" label="11"></option>
                        <option value="17" label="17"></option>
                        <option value="22" label="22"></option>
                    </datalist>
                </label>
                <button id="zoomInBtn" class="icon-btn" title="Zoom In">+</button>
            </div>
            <div id="positionOverlay" class="position-overlay">
                Lat: <span id="mouseLat">0.0000</span>°, Lon: <span id="mouseLon">0.0000</span>°
            </div>
        </div>

        <div id="routeInfoPopup" class="route-info-popup hidden"></div>
    </div>

    <canvas id="mapCanvas"></canvas>

    <script src="tile17.js"></script>
    <script src="kml-parser.js"></script>
    <script src="gpx-parser.js"></script>
    <script src="geo-utils.js"></script>
    <script src="trail-layer-controller.js"></script>
    <script src="map-renderer.js"></script>
    <script src="app.js"></script>
</body>

</html>
