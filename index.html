<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KML Canvas Viewer</title>
    <meta name="theme-color" content="#0f1115">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <div class="loading-text">Loading Assets...</div>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="dropZone" class="drop-zone hidden">
        <div class="drop-message">
            <span class="icon">📂</span>
            <h2>Drop KML file here out</h2>
        </div>
    </div>

    <div class="ui-overlay">
        <div class="panel info-panel">
            <h1>KML Viewer</h1>
            <p class="subtitle">Canvas Renderer</p>
            <div id="stats" class="stats">
                <div class="stat-item">
                    <span class="label">Polygons</span>
                    <span id="polyCount" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Lines</span>
                    <span id="lineCount" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">Points</span>
                    <span id="pointCount" class="value">0</span>
                </div>
                <div class="stat-item" style="grid-column: span 3; margin-top: 8px;">
                    <span class="label">Path Distance</span>
                    <span id="pathDistance" class="value" style="color: var(--accent);">-</span>
                </div>
            </div>
            <div class="controls-hint">
                <p>🖱️ Drag to Pan</p>
                <p>📜 Scroll to Zoom</p>
                <p>📂 Drag & Drop KML</p>
            </div>
        </div>

        <div id="layersPanel" class="panel layers-panel hidden">
            <h2>Layers</h2>
            <label class="layer-item">
                <input type="checkbox" class="layer-checkbox" id="layerSquadrats" checked>
                <span class="layer-label">Squadrats (Z14)</span>
            </label>
            <label class="layer-item">
                <input type="checkbox" class="layer-checkbox" id="layerSquadrathinos" checked>
                <span class="layer-label">Squadrathinos (Z17)</span>
            </label>
            <label class="layer-item">
                <input type="checkbox" class="layer-checkbox" id="layerUbersquadrat" checked>
                <span class="layer-label">Ubersquadrat (Z11)</span>
            </label>
            <label class="layer-item">
                <input type="checkbox" class="layer-checkbox" id="layerUbersquadratinho" checked>
                <span class="layer-label">Ubersquadratinho (Z14)</span>
            </label>

            <div class="divider" style="width: 100%; height: 1px; margin: 12px 0;"></div>
            <h3 style="font-size: 14px; margin: 8px 0 4px 0; color: #9ca3af;">Map Source</h3>
            <select id="mapSource" class="panel-select">
                <option value="standard">🗺️ Standard (OSM)</option>
                <option value="cycle">🚲 Cycle Map (OCM)</option>
            </select>

            <div class="divider" style="width: 100%; height: 1px; margin: 12px 0;"></div>
            <h3 style="font-size: 14px; margin: 8px 0 4px 0; color: #9ca3af;">Polygon Rendering</h3>
            <label class="layer-item">
                <input type="checkbox" class="layer-checkbox" id="drawOuterBoundary" checked>
                <span class="layer-label">Draw Outer Boundaries</span>
            </label>
            <label class="layer-item">
                <input type="checkbox" class="layer-checkbox" id="drawInnerBoundary" checked>
                <span class="layer-label">Draw Inner Boundaries</span>
            </label>
        </div>

        <div id="mapAttribution" class="map-attribution">
            Tiles © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors
        </div>

        <div class="panel controls-panel">
            <button id="layersBtn" class="icon-btn" title="Toggle Layers">☰</button>
            <div class="divider"></div>
            <button id="calcPathBtn" class="icon-btn" title="Calculate Path">📍</button>
            <div class="divider"></div>
            <button id="resetViewBtn" class="icon-btn" title="Reset View">⟲</button>
            <div class="divider"></div>
            <button id="zoomInBtn" class="icon-btn" title="Zoom In">+</button>
            <button id="zoomOutBtn" class="icon-btn" title="Zoom Out">−</button>
        </div>

        <div id="positionOverlay" style="position: absolute; bottom: 20px; left: 20px; background: rgba(0, 0, 0, 0.75); color: #ffffff; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; pointer-events: none; border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(12px); box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            Lat: <span id="mouseLat">0.0000</span>°, Lon: <span id="mouseLon">0.0000</span>°
        </div>
    </div>

    <canvas id="mapCanvas"></canvas>

    <script src="https://maps.googleapis.com/maps/api/js?v=quarterly&libraries=geometry"></script>
    <script src="squardat.js"></script>
    <script src="kml-parser.js"></script>
    <script src="map-renderer.js"></script>
    <script src="app.js"></script>
</body>

</html>
