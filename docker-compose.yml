services:
  kmlviewer:
    container_name: kmlviewer
    image: kmlviewer
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 5174
      EXTERNAL_GPX_DIR: /maps/gpx
      USER_GPX_DIR: /maps/user-gpx
      DATABASE_URL: postgres://kmlviewer:kmlviewer@postgres:5432/kmlviewer
    ports:
      - "5174:5174"
    volumes:
      - D:/Maps/Gpx:/maps/gpx:ro
      - D:/Maps/UserGpx:/maps/user-gpx:ro
      - ./gpxes:/app/gpxes
    depends_on:
      postgres:
        condition: service_healthy

  gpx-importer:
    image: kmlviewer
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "import:gpx"]
    profiles:
      - import
    environment:
      EXTERNAL_GPX_DIR: /maps/gpx
      USER_GPX_DIR: /maps/user-gpx
      DATABASE_URL: postgres://kmlviewer:kmlviewer@postgres:5432/kmlviewer
    volumes:
      - D:/Maps/Gpx:/maps/gpx:ro
      - D:/Maps/UserGpx:/maps/user-gpx:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: kmlviewer-postgres
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: kmlviewer
      POSTGRES_USER: kmlviewer
      POSTGRES_PASSWORD: kmlviewer
    ports:
      - "15433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmlviewer -d kmlviewer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
